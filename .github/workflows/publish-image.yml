name: publish-image

on:
  push:
    branches: [main]
    paths: [Dockerfile, requirements.txt, src/**, scripts/publish-image.sh, .github/workflows/publish-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/publish-image.sh "$GITHUB_REPOSITORY_OWNER" "$GITHUB_ACTOR" "$GH_TOKEN" "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
