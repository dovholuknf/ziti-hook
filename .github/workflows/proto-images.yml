name: proto-images
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['proto/**', 'proto-c/**', 'scripts/build-proto-images.sh', '.github/workflows/proto-images.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-proto-images.sh "$GITHUB_STEP_SUMMARY"
